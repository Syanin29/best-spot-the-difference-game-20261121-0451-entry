<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TWIN TIDES — Echo-Ring Spot Hunt</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #081826; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="TWIN TIDES: Echo-Ring Spot Hunt. Two near-identical pictures side by side. Click every difference before the tide timer runs out — 12 per scene, 4 scenes, 48 in all."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
